# Local development stack. Postgres and Redis are NOT published to the host: only the API and the
# frontend are reachable from outside the compose network.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag   # development only; managed Postgres (Neon etc.) is used in production
      POSTGRES_DB: rag
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    image: rag-backend
    env_file: .env
    environment:
      RESULTS_PATH: /data/results/results.csv
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]
    volumes:
      - uploads:/data/uploads
      - hfcache:/hf-cache
      - results:/data/results
      - ./experiments/benchmark.jsonl:/srv/experiments/benchmark.jsonl:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  worker:
    image: rag-backend
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=2
    env_file: .env
    depends_on:
      api: {condition: service_healthy}   # the API applies migrations first
      redis: {condition: service_healthy}
    volumes:
      - uploads:/data/uploads
      - hfcache:/hf-cache
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]

volumes:
  pgdata:
  uploads:
  hfcache:
  results:
  ollama:
