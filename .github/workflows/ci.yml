name: CI
on:
  push: {branches: [main]}
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: rag, POSTGRES_PASSWORD: rag, POSTGRES_DB: rag_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/rag_test
      TEST_DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/rag_test
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1
      MIN_RERANK_SCORE: "-3.0"   # tests use a fake reranker tuned for this cutoff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements-base.txt}
      # requirements-dev.txt omits sentence-transformers/torch: the tests fake the models, so CI stays fast.
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply and match the models
        run: alembic upgrade head && alembic check
      - name: Unit + API + isolation tests (real Postgres)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config -q
      - run: docker compose build
